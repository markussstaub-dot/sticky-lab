<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticky Lab Mockup</title>
<style>
:root{--bg:#e9e6df;--ink:#111;--paper:#f4f2ec;--muted:#666}
body{margin:0;background:var(--bg);font-family:Helvetica,Arial,sans-serif;color:var(--ink);padding:16px}
h1{font-size:20px;margin:0 0 4px}p.k{margin:0 0 16px;color:var(--muted);font-size:14px}
.grid{display:flex;flex-wrap:wrap;gap:20px}
figure{margin:0;max-width:820px;width:100%}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.dev{background:#2b2b2b;border-radius:18px;padding:14px}
svg{display:block;width:100%;height:auto;background:var(--paper);border-radius:4px}
svg text{font-family:Helvetica,Arial,sans-serif;fill:#111}
</style></head><body>
<h1>Sticky Lab: Bildschirme im Entwurf</h1>
<p class="k">800 × 480, nur Schwarz/Weiß, Braun-Stil. Rolle statt Farbe: Doppelring = Hauptaktion, schwarz = Auswahl, Rasterrand = Werkzeug, dünner Ring = Nebensache.</p>
<svg width="0" height="0" style="position:absolute"><defs>
 <pattern id="r" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#111"/><rect x="2" y="2" width="2" height="2" fill="#111"/></pattern>
 <pattern id="b4" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#111"/><rect x="4" y="4" width="1" height="1" fill="#111"/><rect x="4" width="1" height="1" fill="#111"/><rect y="4" width="1" height="1" fill="#111"/></pattern>
</defs></svg>
<div class="grid">

<figure><div class="dev"><svg viewBox="0 0 800 480">
 <text x="20" y="32" font-size="22" font-weight="bold">Übersicht</text>
 <text x="780" y="32" font-size="18" text-anchor="end">⟳ 3 · ▮▮▮▯ 71 % · LAB</text>
 <line x1="0" y1="46" x2="800" y2="46" stroke="#111" stroke-width="2"/>
 <g font-size="22" text-anchor="middle">
  <rect x="30" y="70" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="4"/><text x="115" y="140">1</text><text x="115" y="175">Refresh</text>
  <rect x="220" y="70" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="2"/><text x="305" y="140">2</text><text x="305" y="175">Schrift</text>
  <rect x="410" y="70" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="2"/><text x="495" y="140">3</text><text x="495" y="175">Raster</text>
  <rect x="600" y="70" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="2"/><text x="685" y="140">4</text><text x="685" y="175">Braun</text>
  <rect x="30" y="250" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="2"/><text x="115" y="320">5</text><text x="115" y="355">Bewegung</text>
  <rect x="220" y="250" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="2"/><text x="305" y="320">6</text><text x="305" y="355">Touch</text>
  <rect x="410" y="250" width="170" height="160" rx="22" fill="none" stroke="#111" stroke-width="2"/><text x="495" y="320">7</text><text x="495" y="355">Instrumente</text>
  <rect x="600" y="250" width="170" height="160" rx="22" fill="none" stroke="url(#r)" stroke-width="6"/><text x="685" y="320" font-size="18">zurück</text><text x="685" y="350" font-size="18">zu EDC</text><text x="685" y="390" font-size="13">(nur Variante B)</text>
 </g>
 <text x="400" y="458" font-size="16" text-anchor="middle">KI = Übersicht · ▲▼ = blättern · KI halten = Foto · ▲+▼ = Hilfe</text>
</svg></div><figcaption>KI kurz: Übersicht mit Kacheln, Tippen springt zur Station.</figcaption></figure>

<figure><div class="dev"><svg viewBox="0 0 800 480">
 <text x="20" y="32" font-size="22" font-weight="bold">1 · Refresh-Labor</text>
 <text x="780" y="32" font-size="18" text-anchor="end">⟳ 7 seit voll · LAB</text>
 <line x1="0" y1="46" x2="800" y2="46" stroke="#111" stroke-width="2"/>
 <!-- Testmuster -->
 <rect x="20" y="64" width="360" height="300" fill="none" stroke="#111" stroke-width="2"/>
 <g><rect x="20" y="64" width="120" height="150" fill="url(#r)"/><rect x="140" y="64" width="120" height="150" fill="#111"/><rect x="260" y="64" width="120" height="150" fill="url(#b4)"/></g>
 <text x="36" y="262" font-size="30" font-weight="bold">Aa 0123</text>
 <text x="36" y="296" font-size="16">Ghosting-Probe: dieser Text springt</text>
 <text x="36" y="320" font-size="12">bei jedem Teil-Refresh um 1 Zeile weiter</text>
 <text x="36" y="350" font-size="9">kleinste Schrift 9 px, sieht man Reste?</text>
 <!-- Messwerte -->
 <text x="410" y="90" font-size="16">letzter Lauf</text>
 <text x="410" y="160" font-size="64" font-weight="bold">742</text><text x="560" y="160" font-size="26">ms</text>
 <text x="410" y="195" font-size="18">Teil · mit Wachhalten · 800×480</text>
 <text x="410" y="235" font-size="16">Voll ? ms · Teil 840 · ohne Schlaf 617</text>
 <text x="410" y="262" font-size="16">Ghosting sichtbar ab: ? (Tippen „sehe Reste“)</text>
 <!-- Knöpfe -->
 <g font-size="20" text-anchor="middle">
  <rect x="20" y="390" width="160" height="58" rx="29" fill="#111"/><text x="100" y="426" fill="#f4f2ec" style="fill:#f4f2ec">Teil</text>
  <rect x="200" y="390" width="160" height="58" rx="29" fill="none" stroke="#111" stroke-width="2"/><text x="280" y="426">Voll</text>
  <rect x="380" y="390" width="160" height="58" rx="29" fill="none" stroke="#111" stroke-width="2"/><text x="460" y="426">Schnell</text>
  <circle cx="680" cy="400" r="58" fill="none" stroke="#111" stroke-width="3"/><circle cx="680" cy="400" r="48" fill="none" stroke="#111" stroke-width="3"/><text x="680" y="408" font-weight="bold">Los</text>
 </g>
</svg></div><figcaption>Station 1: Refresh-Art wählen (schwarz = gewählt), „Los“ misst und schreibt eine Zeile in /lab/messungen.csv. Die Zahlen sind EDC-Messwerte als Platzhalter.</figcaption></figure>

<figure><div class="dev"><svg viewBox="0 0 800 480">
 <text x="20" y="32" font-size="22" font-weight="bold">4 · Braun-Baukasten</text>
 <text x="780" y="32" font-size="18" text-anchor="end">Zeichnen 4 ms · LAB</text>
 <line x1="0" y1="46" x2="800" y2="46" stroke="#111" stroke-width="2"/>
 <g font-size="14" text-anchor="middle">
  <text x="140" y="76">Ruhe</text><text x="400" y="76">gedrückt</text><text x="660" y="76">aktiv</text>
  <!-- Doppelring -->
  <circle cx="140" cy="140" r="46" fill="none" stroke="#111" stroke-width="3"/><circle cx="140" cy="140" r="37" fill="none" stroke="#111" stroke-width="3"/><text x="140" y="146" font-size="18">Start</text>
  <circle cx="400" cy="140" r="46" fill="#111"/><circle cx="400" cy="140" r="37" fill="none" stroke="#f4f2ec" stroke-width="3"/><text x="400" y="146" font-size="18" style="fill:#f4f2ec">Start</text>
  <circle cx="660" cy="140" r="46" fill="none" stroke="#111" stroke-width="3"/><circle cx="660" cy="140" r="37" fill="#111"/><text x="660" y="146" font-size="18" style="fill:#f4f2ec">Stopp</text>
  <!-- Pillen -->
  <rect x="60" y="210" width="160" height="58" rx="29" fill="none" stroke="#111" stroke-width="2"/><text x="140" y="245" font-size="18">± 10</text>
  <rect x="320" y="210" width="160" height="58" rx="29" fill="none" stroke="#111" stroke-width="5"/><text x="400" y="245" font-size="18">± 10</text>
  <rect x="580" y="210" width="160" height="58" rx="29" fill="#111"/><text x="660" y="245" font-size="18" style="fill:#f4f2ec">± 10</text>
  <!-- Werkzeug Rasterrand -->
  <rect x="60" y="290" width="160" height="58" rx="29" fill="none" stroke="url(#r)" stroke-width="6"/><text x="140" y="325" font-size="18">Lupe</text>
  <rect x="320" y="290" width="160" height="58" rx="29" fill="url(#r)"/><rect x="330" y="300" width="140" height="38" rx="19" fill="#f4f2ec"/><text x="400" y="325" font-size="18">Lupe</text>
  <rect x="580" y="290" width="160" height="58" rx="29" fill="#111"/><text x="660" y="325" font-size="18" style="fill:#f4f2ec">Lupe</text>
  <!-- Schieber -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="2">
   <line x1="60" y1="388" x2="60" y2="412"/><line x1="230" y1="392" x2="230" y2="408"/><line x1="400" y1="388" x2="400" y2="412"/><line x1="570" y1="392" x2="570" y2="408"/><line x1="740" y1="388" x2="740" y2="412"/>
  </g>
  <rect x="440" y="378" width="44" height="44" rx="22" fill="#111"/>
  <text x="400" y="452" font-size="14">Schieber · Rastung alle 25 % · Knopfmaß 58 px</text>
 </g>
</svg></div><figcaption>Station 4: jedes Bauteil in drei Zuständen, direkt in der Firmware gezeichnet. Tippen zeigt den echten Druck-Zustand per Teil-Refresh.</figcaption></figure>

</div></body></html>
